# Local development for the CTT Ranking System (Laravel app in ./ctt).
#
#   docker compose up -d --build                 # app on http://localhost:8000
#   docker compose exec app php artisan db:seed  # demo admin / AO / student logins
#   docker compose exec app php artisan test
#   docker compose logs -f app
#   docker compose down                          # add -v to wipe the database
#
# PHP version: defaults to 8.5 (Laravel 13 supports 8.3–8.5).
# To try another: PHP_VERSION=8.4 docker compose up -d --build

services:
  app:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: ctt-app:php${PHP_VERSION:-8.5}
    working_dir: /var/www/html
    volumes:
      - ./ctt:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # The entrypoint copies these into ctt/.env on every start, because
      # `php artisan serve` doesn't pass env vars through to its workers.
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ctt
      DB_USERNAME: ctt
      DB_PASSWORD: secret
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ctt
      MYSQL_USER: ctt
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      # 3307 on the host so it doesn't clash with a locally installed MySQL.
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds the Vite assets once (public/build) and exits.
  assets:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./ctt:/var/www/html
    # npm ci installs exactly what package-lock.json says and never rewrites it.
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

volumes:
  mysql-data:
