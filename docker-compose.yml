# Local development for the CTT Ranking System (Laravel app in ./ctt).
#
#   docker compose up -d --build                 # app on http://localhost:8000
#   docker compose exec app php artisan db:seed  # demo admin / AO / student logins
#   docker compose exec app php artisan test
#   docker compose logs -f app
#   docker compose down                          # add -v to wipe the database
#
# PHP version: 8.2 runs Laravel 10–12 with the current composer.lock.
# Laravel 13 needs 8.3+: run with PHP_VERSION=8.3 docker compose up -d --build

services:
  app:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: ctt-app:php${PHP_VERSION:-8.2}
    working_dir: /var/www/html
    volumes:
      - ./ctt:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # The entrypoint copies these into ctt/.env on every start, because
      # `php artisan serve` doesn't pass env vars through to its workers.
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ctt
      DB_USERNAME: ctt
      DB_PASSWORD: secret
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ctt
      MYSQL_USER: ctt
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      # 3307 on the host so it doesn't clash with a locally installed MySQL.
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds the Vite assets once (public/build) and exits.
  assets:
    image: node:24-alpine
    working_dir: /var/www/html
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      CI: "true" # non-interactive: pnpm never waits on a prompt
    volumes:
      - ./ctt:/var/www/html
      # Linux node_modules kept apart from the Mac's ctt/node_modules:
      # esbuild ships different native binaries per OS.
      - node-modules:/var/www/html/node_modules
    # Corepack installs the pnpm version pinned in package.json ("packageManager").
    # --frozen-lockfile installs exactly what pnpm-lock.yaml says and never rewrites it.
    # The pnpm store lives in the node-modules volume so it's cached and stays out of ctt/.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --store-dir /var/www/html/node_modules/.pnpm-store && pnpm run build"

volumes:
  mysql-data:
  node-modules:
